[project]
name = "evalkit-llm"
version = "0.1.0"
description = "Regression tests for LLM apps: YAML test suites, deterministic + LLM-as-judge assertions, multi-model comparison, CI gating."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "omergazi34" }]
requires-python = ">=3.11"
keywords = ["llm", "evals", "testing", "anthropic", "claude", "ollama", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=1.10",
    "click>=8.1",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/omergazi34/evalkit"
Issues = "https://github.com/omergazi34/evalkit/issues"

[project.scripts]
evalkit = "evalkit.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-jsonschema",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["anthropic.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["evalkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
